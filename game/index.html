<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stormharvest — catch the lightning, keep the town lit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Stormharvest: fly a storm-kite with WASD, arrows or mouse, be inside the glowing ring when lightning strikes to harvest charge, fill the town batteries through seven storms, and defeat the Supercell"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
